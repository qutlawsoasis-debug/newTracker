version: '3.8'

services:
  gain-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gain-tracker-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 100M
